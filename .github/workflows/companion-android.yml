name: Build Android MVP
on:
  push:
    branches: [main]
    paths: ['companion/**', '.github/workflows/companion-android.yml']
  pull_request:
    paths: ['companion/**', '.github/workflows/companion-android.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Compile APK
        run: gradle --no-daemon -p companion :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: companion-debug-apk
          path: companion/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
